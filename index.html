<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HomeBase — Property Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topnav">
  <div class="topnav-brand">🏠 HomeBase</div>
  <div class="topnav-right">
    <span class="usage-pill" id="usagePill"></span>
    <button class="nav-btn ghost" onclick="showSaved()">♥ Saved</button>
    <button class="nav-btn ghost" onclick="showSettings()">⚙ Settings</button>
    <button class="nav-btn ghost" id="themeToggle" onclick="toggleTheme()">☀</button>
  </div>
</header>
<div class="search-bar-wrap">
  <input id="f_location" class="search-input" type="text" placeholder="City, ZIP, or address…" onkeydown="if(event.key==='Enter')triggerSearch()">
  <button class="nav-btn primary" onclick="triggerSearch()">Search</button>
  <button class="nav-btn ghost" onclick="toggleFilterDrawer()">Filters ⌄</button>
</div>
<div class="quick-sort-strip">
  <button class="quick-sort active" data-sort="newest"     onclick="setSort('newest')">Newest</button>
  <button class="quick-sort"        data-sort="price_asc"  onclick="setSort('price_asc')">Price ↑</button>
  <button class="quick-sort"        data-sort="price_desc" onclick="setSort('price_desc')">Price ↓</button>
  <button class="quick-sort"        data-sort="acres_desc" onclick="setSort('acres_desc')">Most land</button>
  <button class="quick-sort"        data-sort="dom_asc"    onclick="setSort('dom_asc')">Days listed</button>
  <span class="result-count" id="resultCount"></span>
</div>
<div class="filter-drawer" id="filterDrawer">
  <div class="filter-grid">
    <label class="filter-label">Max price
      <input id="f_maxPrice" class="filter-input" type="number" placeholder="700000">
    </label>
    <label class="filter-label">Min beds
      <input id="f_minBeds" class="filter-input" type="number" placeholder="3">
    </label>
    <label class="filter-label">Min baths
      <input id="f_minBaths" class="filter-input" type="number" placeholder="2">
    </label>
    <label class="filter-label">Min acres
      <input id="f_minAcres" class="filter-input" type="number" placeholder="1">
    </label>
    <label class="filter-label">Max acres
      <input id="f_maxAcres" class="filter-input" type="number" placeholder="">
    </label>
    <label class="filter-label">Type
      <input id="f_type" class="filter-input" type="text" placeholder="house / condo / land">
    </label>
    <label class="filter-label">Keywords
      <input id="f_features" class="filter-input" type="text" placeholder="pool, barn, waterfront…">
    </label>
    <label class="filter-label">Sort
      <select id="f_sort" class="filter-input">
        <option value="newest">Newest</option>
        <option value="price_asc">Price low → high</option>
        <option value="price_desc">Price high → low</option>
        <option value="acres_desc">Most land</option>
        <option value="dom_asc">Days listed</option>
      </select>
    </label>
    <label class="filter-label">Source
      <select id="providerSelect" class="filter-input" onchange="updateUsagePill()"></select>
    </label>
  </div>
  <div class="filter-actions">
    <button class="nav-btn primary" onclick="triggerSearch();toggleFilterDrawer()">Apply filters</button>
    <button class="nav-btn ghost"   onclick="resetFilters()">Reset</button>
  </div>
</div>
<main class="results-wrap">
  <div class="results-grid" id="resultsGrid">
    <div class="empty-state">
      <div style="font-size:48px;margin-bottom:14px">🏠</div>
      <div style="font-weight:700;font-size:18px;margin-bottom:8px">Ready to search</div>
      <div style="color:var(--muted);font-size:14px">Enter a city or ZIP above and click Search.</div>
    </div>
  </div>
</main>
<div class="side-panel hidden" id="savedPanel">
  <div class="side-panel-header">
    <h2>Saved listings</h2>
    <button class="modal-close" onclick="hideSaved()">✕</button>
  </div>
  <div class="side-panel-body" id="savedBody"></div>
</div>
<div class="side-panel hidden" id="settingsPanel">
  <div class="side-panel-header">
    <h2>⚙ API usage &amp; settings</h2>
    <button class="modal-close" onclick="hideSettings()">✕</button>
  </div>
  <div class="side-panel-body" id="settingsBody"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
